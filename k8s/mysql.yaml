apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dvmd-mysql-pvc
  namespace: dvmd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvmd-mysql
  namespace: dvmd
  labels:
    app: dvmd-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dvmd-mysql
  template:
    metadata:
      labels:
        app: dvmd-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dvmd-config
                  key: DVMD_DB_NAME
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d/01-dvmd.sql
              subPath: 01-dvmd.sql
              readOnly: true
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: dvmd-mysql-pvc
        - name: db-init
          configMap:
            name: dvmd-config
            items:
              - key: 01-dvmd.sql
                path: 01-dvmd.sql
---
apiVersion: v1
kind: Service
metadata:
  name: dvmd-mysql
  namespace: dvmd
  labels:
    app: dvmd-mysql
spec:
  type: ClusterIP
  selector:
    app: dvmd-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
